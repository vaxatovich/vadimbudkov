.cases-surface{min-height:calc(100svh - 75px);overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;isolation:isolate;padding:65px 24px 100px;background:#fffefb;background-image:repeating-linear-gradient(20deg,rgba(136,183,251,.075) 0 2px,transparent 2px 29px),repeating-linear-gradient(-20deg,rgba(242,118,196,.067) 0 2px,transparent 2px 30px)}

.cases-content{width:100%;max-width:1120px;display:flex;align-items:center;flex-direction:column;text-align:center;position:relative;z-index:1}
.cases-heading{margin:0;color:#5630c6;font-family:'Comic Neue','Comic Sans MS','Trebuchet MS',cursive;font-size:clamp(64px,10vw,152px);font-weight:1000;line-height:1.08;letter-spacing:-.035em;transform:rotate(-2deg);text-shadow:1px 1px rgba(100,53,222,.2),-1px 0 rgba(100,53,222,.22)}
.cases-underline{height:10px;width:min(450px,65vw);margin:10px auto 26px;background:repeating-linear-gradient(170deg,#ec43af 0 5px,#fa6ac7 5px 7px);border-radius:60% 35% 55% 42%;transform:rotate(-2.5deg)}
