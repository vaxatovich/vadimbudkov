<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#5423c9">
  <meta name="robots" content="noindex,follow">
  <title>Кейсы — Вадим Будьков</title>
  <meta name="description" content="Упс. Кейсы еще в разработке.">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preload" href="assets/cases-art.webp" as="image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Neucha&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#fffdfc}
    body{font-family:"Neucha","Comic Sans MS","Trebuchet MS",cursive;color:#5424bc}
    a:focus-visible{outline:4px dashed #f8ca22;outline-offset:4px}
    .visually-hidden{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
    .skip-link{position:absolute;left:12px;top:-100px;background:white;padding:10px 18px;color:#5424bc;z-index:10}
    .skip-link:focus{top:10px}
    .desktop-drawing{position:relative;width:100%;margin:0 auto;max-width:1920px}
    .desktop-drawing img{display:block;width:100%;height:auto}
    .desktop-drawing nav a{display:block;position:absolute;top:var(--top);left:var(--left);width:var(--width);height:var(--height);border-radius:12px}
    .desktop-drawing nav a:hover{background:rgba(255,255,255,.08)}
    .mobile-drawing{display:none}
    @media(max-width:760px){
      .desktop-drawing{display:none}
      .mobile-drawing{display:flex;flex-direction:column;min-height:100svh;overflow:hidden;background:#fffdfb}
      .mobile-nav{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:13px 11px;min-height:68px;background-color:#5529c8;background-image:repeating-linear-gradient(-11deg,rgba(255,255,255,.21) 0 2px,transparent 2px 7px),repeating-linear-gradient(7deg,rgba(29,0,113,.2) 0 2px,transparent 2px 8px)}
      .mobile-nav a{text-decoration:none;white-space:nowrap;color:white;font-size:clamp(14px,3.9vw,22px);font-weight:800;line-height:1.05;transform:rotate(-1deg)}
      .mobile-nav a[aria-current="page"]{text-decoration:underline;text-decoration-color:#f36abc;text-decoration-thickness:4px;text-underline-offset:7px}
      .mobile-nav a:last-child{padding:7px 9px;border:2px solid #fff;border-radius:42% 36% 44% 40%/37% 42% 38% 45%;font-size:clamp(13px,3.4vw,20px);transform:rotate(2deg)}
      .mobile-hero{position:relative;display:flex;flex-direction:column;flex:1;align-items:center;justify-content:flex-start;min-height:calc(100svh - 68px);padding:65px 18px 30px;overflow:hidden;background:#fffdfa}
      .mobile-hero:before{content:"";position:absolute;inset:0;background-image:url("assets/cases-art.webp");background-size:auto 100%;background-repeat:no-repeat;background-position:52% 10%;opacity:.70;filter:saturate(1.05)}
      .mobile-hero:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(255,253,250,.70),rgba(255,253,250,.84) 45%,rgba(255,253,250,0) 86%);pointer-events:none}
      .mobile-hero h1{position:relative;z-index:1;margin:0;text-align:center;max-width:13ch;font-size:clamp(43px,10.5vw,67px);line-height:1.07;letter-spacing:-.012em;font-weight:900;transform:rotate(-2deg);color:#5825c5;text-shadow:1px 1px #fff}
      .mobile-hero h1 span{color:#ed35a7}
      .mobile-hero .scribble{position:relative;z-index:1;width:78%;max-width:345px;height:10px;margin-top:25px;transform:rotate(-2.5deg);border-radius:60% 30% 40% 25%;background:repeating-linear-gradient(165deg,#ffdb17 0 4px,#f3bd02 4px 7px,#ffe33f 7px 10px)}
      .mobile-nav a:focus-visible{outline-color:#f6db24}
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#content">К содержимому</a>
  <main id="content">
    <section class="desktop-drawing" aria-label="Кейсы Вадима Будькова">
      <img src="assets/cases-art.webp" width="1672" height="941" alt="" fetchpriority="high">
      <h1 class="visually-hidden">Упс. Кейсы еще в разработке</h1>
      <nav aria-label="Главное меню">
        <a href="index.html" style="--left:23%;--top:1%;--width:11%;--height:9%" aria-label="Главная"><span class="visually-hidden">Главная</span></a>
        <a href="cases.html" aria-current="page" style="--left:36.5%;--top:1%;--width:11%;--height:9%" aria-label="Кейсы"><span class="visually-hidden">Кейсы</span></a>
        <a href="about.html" style="--left:49%;--top:1%;--width:12%;--height:9%" aria-label="Обо мне"><span class="visually-hidden">Обо мне</span></a>
        <a href="https://t.me/borisaguero" target="_blank" rel="noopener noreferrer" style="--left:63%;--top:1%;--width:29%;--height:9%" aria-label="Обсудить проект в телеграм"><span class="visually-hidden">Обсудить проект в телеграм</span></a>
      </nav>
    </section>
    <section class="mobile-drawing" aria-labelledby="cases-mobile-title">
      <nav class="mobile-nav" aria-label="Главное меню">
        <a href="index.html">Главная</a>
        <a href="cases.html" aria-current="page">Кейсы</a>
        <a href="about.html">Обо мне</a>
        <a href="https://t.me/borisaguero" target="_blank" rel="noopener noreferrer" aria-label="Обсудить проект в телеграм">Обсудить ↗</a>
      </nav>
      <div class="mobile-hero">
        <h1 id="cases-mobile-title"><span>Упс.</span> Кейсы еще в разработке</h1>
        <div class="scribble" aria-hidden="true"></div>
      </div>
    </section>
  </main>
</body>
</html>
