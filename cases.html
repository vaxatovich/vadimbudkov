<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#5630cd">
  <meta name="robots" content="noindex,follow">
  <title>Кейсы — Вадим Будьков</title>
  <meta name="description" content="Упс. Кейсы еще в разработке.">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Neucha&display=swap" rel="stylesheet">
  <style>
    :root{--purple:#5528c5;--pink:#ec3da8;--yellow:#fddd2f}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;width:100%}
    body{background:#fffdfa;color:var(--purple);font-family:"Neucha","Comic Sans MS","Trebuchet MS",cursive}
    a{color:inherit}
    a:focus-visible{outline:4px dashed #ffdc2d;outline-offset:5px}
    .skip-link{position:absolute;left:12px;top:-100px;z-index:10;background:white;padding:10px 18px}
    .skip-link:focus{top:8px}
    .cases-nav{
      position:relative;z-index:2;display:flex;align-items:center;justify-content:center;
      gap:clamp(28px,5.6vw,98px);min-height:80px;padding:8px 22px;
      background:#5828ce;
      background-image:
        repeating-linear-gradient(170deg,transparent 0 6px,rgba(185,147,255,.27) 6px 8px,transparent 8px 15px),
        repeating-linear-gradient(8deg,rgba(45,11,119,.28) 0 2px,transparent 2px 9px),
        linear-gradient(90deg,#4b28b9,#6425d9,#4b20b5);
      border-bottom:2px solid #874ceb
    }
    .cases-nav a{
      display:inline-block;font-weight:900;font-size:clamp(20px,2vw,27px);
      color:white;text-decoration:none;white-space:nowrap;line-height:1.1;
      text-shadow:1px 1px rgba(255,255,255,.2);transform:rotate(-1.3deg)
    }
    .cases-nav a:nth-child(2){transform:rotate(.6deg)}
    .cases-nav a[aria-current="page"]{
      text-decoration:underline;text-decoration-color:#f57ac8;
      text-decoration-thickness:5px;text-underline-offset:8px
    }
    .cases-nav .contact{
      border:3px solid #f7ecff;border-radius:45% 40% 47% 37% / 44% 43% 44% 39%;
      padding:7px 19px;transform:rotate(-2deg);box-shadow:2px 2px 0 rgba(236,195,255,.4)
    }
    .cases-hero{
      position:relative;isolation:isolate;overflow:hidden;
      display:flex;align-items:center;min-height:calc(100svh - 80px);
      background:#fffdf9 url("assets/cases-crayon-background.webp") center 53% / cover no-repeat
    }
    .cases-copy{
      position:relative;z-index:1;width:min(57%,960px);
      margin:-30px 0 0 6.6%;
    }
    .cases-copy h1{
      font-family:"Neucha","Comic Sans MS","Trebuchet MS",cursive;
      color:#5924c0;font-size:clamp(48px,5.65vw,94px);font-weight:900;
      line-height:1.06;letter-spacing:.012em;margin:0;max-width:100%;
      transform:rotate(-1.8deg);
      text-shadow:-1.2px -1px #6933d0,1.3px 1.5px #a47be8,2px 3px #fffaf8;
      text-wrap:balance
    }
    .cases-copy h1 .oops{
      color:#f036a8;text-shadow:-1px 1px #d92f93,1px 2px #fffafa
    }
    .cases-copy h1 .last-line{white-space:nowrap}
    .crayon-underline{
      display:block;position:relative;width:86%;max-width:680px;height:13px;
      margin:29px 0 0 6px;transform:rotate(-2deg);
      border-radius:57% 41% 43% 60%;
      background:repeating-linear-gradient(171deg,#ffdb1b 0 4px,#f7b900 4px 6px,#ffed54 6px 10px);
      box-shadow:1px 3px 0 rgba(245,181,10,.23);
    }
    @media(max-width:850px){
      .cases-nav{min-height:66px;gap:clamp(12px,3vw,27px);justify-content:space-between;padding:9px 12px}
      .cases-nav a{font-size:clamp(13px,3.1vw,20px)}
      .cases-nav .contact{font-size:clamp(12px,3vw,18px);border-width:2px;padding:6px 10px}
      .cases-hero{min-height:calc(100svh - 66px);background-position:56% center}
      .cases-copy{
        align-self:flex-start;width:94%;margin:clamp(48px,13vh,98px) auto 0;
        padding:0 14px;text-align:center
      }
      .cases-copy h1{font-size:clamp(39px,8.2vw,67px);line-height:1.1;text-shadow:-1px 1px #7144df,2px 2px white}
      .cases-copy h1 .last-line{white-space:normal}
      .crayon-underline{margin:19px auto 0;max-width:480px;width:86%;height:10px}
    }
    @media(max-width:390px){
      .cases-nav{gap:7px;padding:9px 7px}
      .cases-nav a{font-size:12px}
      .cases-nav .contact{font-size:12px;padding:5px 6px}
      .cases-copy h1{font-size:clamp(35px,8vw,42px)}
    }
  </style>
</head>
<body>
  <a href="#main" class="skip-link">К содержимому</a>
  <nav class="cases-nav" aria-label="Главное меню">
    <a href="index.html">Главная</a>
    <a href="cases.html" aria-current="page">Кейсы</a>
    <a href="about.html">Обо мне</a>
    <a class="contact" href="https://t.me/borisaguero" target="_blank" rel="noopener noreferrer">Обсудить проект ↗</a>
  </nav>
  <main id="main" class="cases-hero">
    <div class="cases-copy">
      <h1><span class="oops">Упс.</span> Кейсы еще<br><span class="last-line">в разработке</span></h1>
      <span class="crayon-underline" aria-hidden="true"></span>
    </div>
  </main>
</body>
</html>
